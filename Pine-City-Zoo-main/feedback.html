<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - Pine City Zoo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header">
        <img src="./images/logo.png" alt="Zoo Logo">
    </div>

    <div id="tabs-top">
        <a href="animals.html">ANIMALS</a>
        <a href="index.html">MAP</a>
        <a href="places.html">PLACES</a>
    </div>

    <div id="main">
        <div id="content">
            <div id="info-box-full">
                <h3>SHARE YOUR FEEDBACK</h3>
                <p>We'd love to hear about your visit to Pine City Zoo!</p>
                <form>
                    <p>
                        <label for="name">Name:</label><br>
                        <input type="text" id="name" name="name" placeholder="Your name">
                    </p>
                    <p>
                        <label for="email">Email:</label><br>
                        <input type="email" id="email" name="email" placeholder="Your email">
                    </p>
                    <p>
                        <label for="rating">Rating:</label><br>
                        <select id="rating" name="rating">
                            <option value="5">⭐⭐⭐⭐⭐ Excellent</option>
                            <option value="4">⭐⭐⭐⭐ Good</option>
                            <option value="3">⭐⭐⭐ Average</option>
                            <option value="2">⭐⭐ Poor</option>
                            <option value="1">⭐ Very Poor</option>
                        </select>
                    </p>
                    <p>
                        <label for="comments">Comments:</label><br>
                        <textarea id="comments" name="comments" rows="5" placeholder="Tell us about your experience..."></textarea>
                    </p>
                    <p>
                        <button type="submit">Submit Feedback</button>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <div id="tabs-bottom">
        <a href="weather.html">WEATHER</a>
        <a href="feedback.html">FEEDBACK</a>
    </div>
</body>
</html>
